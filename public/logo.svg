<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="mytabibCyanGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C8FA" />
      <stop offset="100%" stop-color="#0099D6" />
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="600" height="500" rx="32" fill="#000000"/>

  <!-- Logo Mark Group -->
  <g transform="translate(100, 40)">
    <!-- Top-Left Cyan Ribbon Stroke -->
    <path 
      d="M 120,240 C 90,240 75,210 90,185 C 115,135 170,80 235,70 C 275,65 305,85 285,120 C 245,185 170,240 120,240 Z" 
      fill="url(#mytabibCyanGradFull)" 
    />
    
    <!-- Middle Cyan Ribbon Stroke -->
    <path 
      d="M 175,240 C 150,240 135,215 150,190 C 180,135 235,80 305,70 C 345,65 375,85 350,125 C 305,190 230,240 175,240 Z" 
      fill="url(#mytabibCyanGradFull)" 
    />

    <!-- Bottom-Right White Ribbon Stroke -->
    <path 
      d="M 235,280 C 210,280 195,255 210,230 C 240,175 295,120 365,110 C 405,105 435,125 410,165 C 365,230 290,280 235,280 Z" 
      fill="#FFFFFF" 
    />

    <!-- Bottom-Right Loop Cap -->
    <path 
      d="M 290,290 C 270,290 255,275 265,255 C 285,210 330,175 385,170 C 415,165 435,185 420,205 C 390,250 335,290 290,290 Z" 
      fill="#FFFFFF" 
      opacity="0.95"
    />
  </g>

  <!-- Typography mytabib -->
  <g transform="translate(110, 360)">
    <text x="0" y="55" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="600" font-size="88" fill="#FFFFFF" letter-spacing="4">mytabib</text>
    <!-- Cyan Smile Accent under 'y' -->
    <path d="M 125,74 Q 148,94 172,74" stroke="#00C8FA" stroke-width="9" stroke-linecap="round" fill="none" />
  </g>
</svg>
